<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TASKIFYRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F6;--card:#fff;--ink:#10202B;--mut:#5B6B77;--acc:#0F8F6E;--gold:#F2A900;--line:#D5DEE4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0C161D;--card:#14232D;--ink:#E8EEF2;--mut:#93A4B0;--line:#243642}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Hind Siliguri','Noto Sans Bengali','Plus Jakarta Sans',system-ui,sans-serif}
.w{max-width:960px;margin:0 auto;padding:0 16px 40px}a{color:var(--acc)}
.ban{height:150px;background:linear-gradient(120deg,#0F8F6E,#10202B);background-size:cover;background-position:center}@media(min-width:720px){.ban{height:220px}}
.pf{display:flex;gap:14px;align-items:flex-end;margin-top:-44px}.av{width:88px;height:88px;border-radius:50%;border:4px solid var(--bg);background:var(--acc);color:#fff;display:grid;place-items:center;font:800 34px 'Plus Jakarta Sans';object-fit:cover;flex:none}
h1,h2,h3{font-family:'Plus Jakarta Sans','Hind Siliguri',sans-serif;margin:0}h1{font-size:26px}h2{font-size:20px;margin:28px 0 12px}.mut{color:var(--mut)}.st{color:var(--gold);letter-spacing:1px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.c{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.cp{padding:14px}
.cv{aspect-ratio:16/10;background:linear-gradient(135deg,#0F8F6E,#1c3a4a);display:grid;place-items:center;color:#fff;font:800 40px 'Plus Jakarta Sans';width:100%;object-fit:cover}
.pr{font:800 20px 'Plus Jakarta Sans'}.b{display:inline-block;border:0;border-radius:10px;background:var(--acc);color:#fff;font:600 15px inherit;padding:10px 16px;cursor:pointer;text-decoration:none}.b.o{background:none;color:var(--acc);border:1px solid var(--acc)}.b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;position:sticky;top:env(safe-area-inset-top,0);background:var(--bg);z-index:5}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font:600 15px inherit;white-space:nowrap;cursor:pointer}.tabs .on{background:var(--acc);color:#fff;border-color:var(--acc)}
.k{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:720px){.k{grid-template-columns:repeat(4,1fr)}}.k .c{padding:14px}.k b{display:block;font:800 24px 'Plus Jakarta Sans'}
label{display:block;font-weight:600;margin:12px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.msg{margin:10px 0;font-weight:600}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),ls=k=>{try{const v=localStorage.getItem(k);try{return JSON.parse(v)}catch(e){return v}}catch(e){return null}};
let lang=ls("zv_lang")==="en"?"en":"bn";const TK=ls("zv_tok")||"";
const D={bn:{buy:"কিনুন",rv:"⭐ রিভিউ",norv:"এখনও কোনো রিভিউ নেই। ক্রেতারা রিভিউ দিলে এখানে দেখা যাবে।",pd:"🛍 প্রোডাক্ট",nopd:"এই স্টোরে এখনও কোনো প্রোডাক্ট নেই।",nf:"স্টোরটি খুঁজে পাওয়া যায়নি।",pw:"চালিত",ov:"📊 ওভারভিউ",pr:"🛍 প্রোডাক্ট",po:"💸 পেআউট",se:"⚙️ স্টোর সেটিংস",vw:"👁 ভিউ",od:"🧾 অর্ডার",cr:"🎯 ক্রয়ের হার",rev:"💰 আয়",l30:"শেষ ৩০ দিন",li:"ড্যাশবোর্ড দেখতে লগইন করুন।",lib:"লগইন পেজে যান",cs:"আপনার স্টোর তৈরি করুন",sl:"স্টোরের ঠিকানা (ইংরেজি ছোট অক্ষর, সংখ্যা ও হাইফেন)",nm:"স্টোরের নাম",bio:"সংক্ষিপ্ত পরিচিতি",sv:"সংরক্ষণ করুন",ti:"শিরোনাম",pc:"দাম (৳)",bl:"বিবরণ",cv:"কভার ছবি",fl:"ডিজিটাল ফাইল (সর্বোচ্চ ২৫ MB)",ad:"নতুন প্রোডাক্ট যোগ করুন",ed:"সম্পাদনা",live:"চালু",draft:"খসড়া",bal:"উত্তোলনযোগ্য ব্যালেন্স",fee:"প্ল্যাটফর্ম ফি",rq:"পেআউটের অনুরোধ করুন",mt:"মাধ্যম",nu:"মোবাইল নম্বর (01XXXXXXXXX)",am:"পরিমাণ (৳)",mn:"সর্বনিম্ন পেআউট ৫০০ টাকা।",hi:"পেআউটের ইতিহাস",pen:"অপেক্ষমাণ",paid:"পরিশোধিত",rej:"বাতিল",lg:"লোগো",bn:"ব্যানার",ok:"সংরক্ষিত হয়েছে।",er:"সমস্যা হয়েছে। আবার চেষ্টা করুন।",up:"আপলোড হচ্ছে…",nof:"ফাইল নেই",per:"শেষ ৩০ দিনে প্রতিদিনের আয়",nod:"এখনও কোনো বিক্রি হয়নি।"},
en:{buy:"Buy",rv:"⭐ Reviews",norv:"No reviews yet. Buyers' reviews will appear here.",pd:"🛍 Products",nopd:"This store has no products yet.",nf:"Store not found.",pw:"Powered by",ov:"📊 Overview",pr:"🛍 Products",po:"💸 Payouts",se:"⚙️ Store settings",vw:"👁 Views",od:"🧾 Orders",cr:"🎯 Conversion",rev:"💰 Revenue",l30:"Last 30 days",li:"Log in to see your dashboard.",lib:"Go to log in",cs:"Create your store",sl:"Store address (lowercase letters, numbers, hyphens)",nm:"Store name",bio:"Short bio",sv:"Save",ti:"Title",pc:"Price (BDT)",bl:"Description",cv:"Cover image",fl:"Digital file (max 25 MB)",ad:"Add a product",ed:"Edit",live:"Live",draft:"Draft",bal:"Available balance",fee:"Platform fee",rq:"Request a payout",mt:"Method",nu:"Mobile number (01XXXXXXXXX)",am:"Amount (BDT)",mn:"Minimum payout is 500 BDT.",hi:"Payout history",pen:"Pending",paid:"Paid",rej:"Rejected",lg:"Logo",bn:"Banner",ok:"Saved.",er:"Something went wrong. Please try again.",up:"Uploading…",nof:"No file",per:"Daily revenue, last 30 days",nod:"No sales yet."}};
const t=k=>D[lang][k]||k,N=n=>lang==="bn"?String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]):String(n),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),money=n=>"৳"+N(Math.round(n).toLocaleString("en-US"));
const api=async(p,o={})=>{try{const r=await fetch(p,{...o,headers:{...(o.headers||{}),...(TK?{Authorization:"Bearer "+TK}:{})}});return await r.json()}catch(e){return{ok:false}}};
const post=(p,b)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
const img=k=>k?"/api/media?k="+encodeURIComponent(k):"";const brand='<b translate="no" class="nt">TASKIFYRA</b>';
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
const m=/^\/s\/([a-z0-9-]+)/.exec(location.pathname);
// ---------- public store ----------
async function store(slug){const r=await api("/api/store?slug="+slug),A=$("#app");if(!r.ok){A.innerHTML=`<div class="w"><h2>${t("nf")}</h2><a href="/">${brand}</a></div>`;return}
const s=r.store,rv=r.reviews||[],avg=pid=>{const x=rv.filter(v=>v.product_id===pid);return x.length?Math.round(x.reduce((a,v)=>a+v.stars,0)/x.length):0};document.title=s.name+" | TASKIFYRA";
A.innerHTML=`<div class="ban" ${s.banner_key?`style="background-image:url(${img(s.banner_key)})"`:""}></div><div class="w"><div class="pf">${s.logo_key?`<img class="av" src="${img(s.logo_key)}" alt="">`:`<div class="av" aria-hidden="true">${esc(s.name.slice(0,1).toUpperCase())}</div>`}<div><h1>${esc(s.name)}</h1><div class="mut">taskifyra.pages.dev/s/${esc(s.slug)}</div></div></div>
<p style="max-width:62ch">${esc(s.bio)}</p><h2>${t("pd")}</h2>${r.products.length?`<div class="g">${r.products.map(p=>`<div class="c">${p.cover_key?`<img class="cv" src="${img(p.cover_key)}" alt="" loading="lazy">`:`<div class="cv" aria-hidden="true">${esc(p.title.slice(0,1))}</div>`}<div class="cp"><h3>${esc(p.title)}</h3><p class="mut" style="margin:6px 0">${esc(p.blurb)}</p>${avg(p.id)?`<div class="st" aria-label="${avg(p.id)}/5">${stars(avg(p.id))}</div>`:""}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="pr">${money(p.price_bdt)}</span><a class="b" href="/?buy=${esc(p.id)}&store=${esc(s.slug)}">${t("buy")}</a></div></div></div>`).join("")}</div>`:`<p class="mut">${t("nopd")}</p>`}
<h2>${t("rv")}</h2>${rv.length?rv.map(v=>`<div class="c cp" style="margin-bottom:10px"><div class="st">${stars(v.stars)}</div><p style="margin:4px 0">${esc(v.body)}</p><span class="mut">${esc(v.who||"")}</span></div>`).join(""):`<p class="mut">${t("norv")}</p>`}
<p class="mut" style="margin-top:36px">${t("pw")} ${brand}</p></div>`}
// ---------- seller dashboard ----------
let M=null,tab="ov",edit=null;const say=(x,ok)=>{const e=$("#msg");if(e){e.textContent=x;e.style.color=ok?"var(--acc)":"#c0392b"}};
async function dash(){const A=$("#app");document.head.insertAdjacentHTML("beforeend",'<meta name="robots" content="noindex">');if(!TK){A.innerHTML=`<div class="w"><h2>${t("li")}</h2><a class="b" href="/">${t("lib")}</a></div>`;return}
M=await api("/api/seller/me");if(!M.ok){A.innerHTML=`<div class="w"><h2>${t("li")}</h2><a class="b" href="/">${t("lib")}</a></div>`;return}
if(!M.store){A.innerHTML=`<div class="w"><h2>${t("cs")}</h2>${sform("")}</div>`;return}draw()}
const sform=(sl,n="",b="")=>`<label>${t("sl")}</label><input id="f_sl" value="${esc(sl)}" ${sl?"readonly":""} pattern="[a-z0-9-]{3,30}"><label>${t("nm")}</label><input id="f_nm" maxlength="60" value="${esc(n)}"><label>${t("bio")}</label><textarea id="f_bio" rows="3" maxlength="300">${esc(b)}</textarea><p><button class="b" onclick="saveStore()">${t("sv")}</button></p><div class="msg" id="msg" role="status"></div>`;
async function saveStore(){const r=await post("/api/seller/store",{slug:$("#f_sl").value.trim(),name:$("#f_nm").value,bio:$("#f_bio").value});if(r.ok)return dash();say(r.error||t("er"))}
const up=(u,f)=>api(u,{method:"PUT",headers:{"Content-Type":f.type||"application/octet-stream"},body:f});
function chart(s){const days=[...Array(30)].map((_,i)=>{const d=new Date(Date.now()+216e5-(29-i)*864e5).toISOString().slice(0,10),x=s.find(v=>v.d===d);return x?x.v:0}),mx=Math.max(1,...days);return `<svg viewBox="0 0 300 90" role="img" aria-label="${t("per")}" style="width:100%;height:auto">${days.map((v,i)=>`<rect x="${i*10+1}" y="${84-v/mx*78}" width="8" height="${Math.max(1,v/mx*78)}" rx="2" fill="var(--acc)" opacity="${v?1:.25}"/>`).join("")}</svg>`}
function draw(){const A=$("#app"),S=M.stats,st=M.store;let h="";
if(tab==="ov")h=`<div class="k"><div class="c"><span class="mut">${t("vw")}</span><b>${N(S.views)}</b></div><div class="c"><span class="mut">${t("od")}</span><b>${N(S.orders)}</b></div><div class="c"><span class="mut">${t("cr")}</span><b>${N(S.views?(S.orders/S.views*100).toFixed(1):0)}%</b></div><div class="c"><span class="mut">${t("rev")}</span><b>${money(S.revenue)}</b></div></div><h2>${t("per")}</h2><div class="c cp">${S.orders?chart(S.series):`<p class="mut">${t("nod")}</p>`}</div>`;
if(tab==="pr")h=`<h2>${edit?t("ed"):t("ad")}</h2><div class="c cp"><label>${t("ti")}</label><input id="p_t" maxlength="100" value="${esc(edit?.title)}"><label>${t("pc")}</label><input id="p_p" type="number" min="49" max="50000" value="${edit?edit.price_bdt:""}"><label>${t("bl")}</label><textarea id="p_b" rows="3" maxlength="400">${esc(edit?.blurb)}</textarea><label>${t("cv")}</label><input id="p_c" type="file" accept="image/jpeg,image/png,image/webp"><label>${t("fl")}</label><input id="p_f" type="file"><p><button class="b" onclick="saveProd()">${t("sv")}</button> ${edit?`<button class="b o" onclick="edit=null;draw()">×</button>`:""}</p><div class="msg" id="msg" role="status"></div></div><h2>${t("pr")}</h2><table>${M.products.map(p=>`<tr><td><b>${esc(p.title)}</b><br><span class="mut">${p.has_file?"":t("nof")}</span></td><td>${money(p.price_bdt)}</td><td>${p.status==="live"?t("live"):t("draft")}</td><td><button class="b o" onclick="edit=M.products.find(x=>x.id==='${esc(p.id)}');draw()">${t("ed")}</button></td></tr>`).join("")}</table>`;
if(tab==="po")h=`<div class="k"><div class="c"><span class="mut">${t("bal")}</span><b>${money(S.balance)}</b></div><div class="c"><span class="mut">${t("fee")}</span><b>${N(M.fee)}%</b></div></div><h2>${t("rq")}</h2><div class="c cp"><label>${t("mt")}</label><select id="y_m"><option>bKash</option><option>Nagad</option><option>Rocket</option></select><label>${t("nu")}</label><input id="y_n" inputmode="numeric" maxlength="11"><label>${t("am")}</label><input id="y_a" type="number" min="500"><p class="mut">${t("mn")}</p><button class="b" onclick="payout()">${t("rq")}</button><div class="msg" id="msg" role="status"></div></div><h2>${t("hi")}</h2><table>${M.payouts.map(x=>`<tr><td>${new Date(x.created_at).toLocaleDateString(lang==="bn"?"bn-BD":"en-GB")}</td><td>${money(x.amount_bdt)}</td><td>${x.status==="paid"?t("paid"):x.status==="rejected"?t("rej"):t("pen")}</td></tr>`).join("")}</table>`;
if(tab==="se")h=`<h2>${t("se")}</h2><div class="c cp">${sform(st.slug,st.name,st.bio)}<label>${t("lg")}</label><input type="file" accept="image/jpeg,image/png,image/webp" onchange="media('logo',this.files[0])"><label>${t("bn")}</label><input type="file" accept="image/jpeg,image/png,image/webp" onchange="media('banner',this.files[0])"><p><a href="/s/${esc(st.slug)}">taskifyra.pages.dev/s/${esc(st.slug)}</a></p></div>`;
A.innerHTML=`<div class="w"><h1 style="margin-top:18px">${esc(st.name)}</h1><div class="tabs" role="tablist">${[["ov","ov"],["pr","pr"],["po","po"],["se","se"]].map(([k,l])=>`<button role="tab" class="${tab===k?"on":""}" aria-selected="${tab===k}" onclick="tab='${k}';edit=null;draw()">${t(l)}</button>`).join("")}</div>${h}<p class="mut" style="margin-top:36px">${t("pw")} ${brand}</p></div>`}
async function saveProd(){const ti=$("#p_t").value,pc=$("#p_p").value,bl=$("#p_b").value,c=$("#p_c").files[0],f=$("#p_f").files[0];say(t("up"),1);let id=edit&&edit.id;
const r=edit?await post("/api/seller/product/update",{id,title:ti,price:pc,blurb:bl}):await post("/api/seller/product",{title:ti,price:pc,blurb:bl});if(!r.ok)return say(r.error||t("er"));id=id||r.id;
if(f){const u=await up("/api/seller/upload?pid="+id+"&name="+encodeURIComponent(f.name),f);if(!u.ok)return say(u.error||t("er"))}if(c){const u=await up("/api/seller/media?kind=cover&pid="+id,c);if(!u.ok)return say(u.error||t("er"))}edit=null;await dash()}
async function media(k,f){if(!f)return;const r=await up("/api/seller/media?kind="+k,f);if(r.ok)dash();else say(r.error||t("er"))}
async function payout(){const r=await post("/api/seller/payout",{method:$("#y_m").value,number:$("#y_n").value,amount:$("#y_a").value});if(r.ok)return dash();say(r.error||t("er"))}
m?store(m[1]):dash();
</script></body></html>
