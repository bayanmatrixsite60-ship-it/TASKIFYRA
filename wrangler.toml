name = "taskifyras"
main = "_worker.js"
compatibility_date = "2025-09-01"

# Flat layout: all site files sit in the repo root. The file ".assetsignore" hides the backend files
# (_worker.js, wrangler.toml, package.json ...) so they are never downloadable.
[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "ZV"
id = "58ce52869edb45078df0207be726ff8a"

# D1: dashboard -> Storage & Databases -> D1 -> Create database "taskifyra" -> copy its Database ID here.
# Tables are created automatically by the worker; there is no SQL to run.
[[d1_databases]]
binding = "DB"
database_name = "taskifyra"
database_id = "​1e641585-5a03-414b-b063-4442f5bf78ae"

# R2: dashboard -> R2 -> Create bucket "taskifyra-files" (keep it PRIVATE).
[[r2_buckets]]
binding = "FILES"
bucket_name = "taskifyra-files"

[vars]
SITE_URL = "https://taskifyra.pages.dev"
ADMIN_EMAIL = "bayanmatrixsite60@gmail.com"
FROM_EMAIL = "Taskifyra <orders@YOUR-VERIFIED-DOMAIN.com>"
FEE_PCT = "10"
PAY_BKASH = "01812410928"
PAY_NAGAD = "01812410928"
PAY_ROCKET = "01812410928"
# bKash automatic payment (optional; also needs the 4 BKASH_* secrets). Remove the leading # to enable:
# BKASH_BASE = "https://tokenized.pay.bka.sh/v1.2.0-beta/tokenized/checkout/"

[triggers]
crons = ["*/10 * * * *"]

# SECRETS (never in this file). Dashboard -> Worker -> Settings -> Variables and Secrets -> Add (type: Secret):
#   ADMIN_TOKEN, FOUNDER_CODE, SESSION_SECRET (32+ random chars), ADMIN_API_KEY (32+ random chars),
#   RESEND_API_KEY (create a NEW key), TG_BOT_TOKEN, TG_CHAT_ID,
#   optional: PW_PEPPER, BKASH_USER, BKASH_PASS, BKASH_APP_KEY, BKASH_APP_SECRET
